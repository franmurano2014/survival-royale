
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SURVIVAL ROYALE</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body {
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1 {color:#ffd43b;font-size:38px}
button,input {
  padding:12px;
  margin:5px;
  border:0;
  border-radius:8px;
}
button {
  background:#ffca28;
  font-weight:bold;
  cursor:pointer;
}
input {width:180px}
canvas {
  width:95%;
  max-width:900px;
  background:#8bcf75;
  border:4px solid #ffd43b;
  margin-top:15px;
}
#estado {color:#8ee8ff}
</style>
</head>
<body>

<h1>🏆 SURVIVAL ROYALE</h1>
<p>¡Conectate y sobreviví!</p>

<h3>🌐 MULTIJUGADOR</h3>
<button onclick="crearSala(false)">Crear partida pública</button>
<button onclick="crearSala(true)">Crear sala privada</button>
<br>
<input id="codigo" placeholder="Código de sala">
<button onclick="unirse()">Entrar</button>
<button onclick="buscarSalas()">Ver partidas públicas</button>

<p id="estado">Conectando al servidor...</p>
<p id="sala"></p>
<div id="partidas"></div>

<canvas id="game" width="900" height="550"></canvas>

<p>WASD o flechas para moverte.</p>

<script>
const socket = io();
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let jugador = {x:450,y:275};
let otros = new Map();
let conectado = false;
let enSala = false;
let ultimoEnvio = 0;

socket.on("connect", () => {
  conectado = true;
  estado("Conectado al servidor.");
});

socket.on("disconnect", () => {
  conectado = false;
  enSala = false;
  estado("Desconectado del servidor.");
});

function estado(texto) {
  document.getElementById("estado").textContent = texto;
}

function crearSala(privada) {
  if (!conectado) return estado("Esperá a conectarte.");

  socket.emit("createRoom", {privateRoom:privada}, respuesta => {
    if (!respuesta?.ok) return estado("No se pudo crear la sala.");
    document.getElementById("codigo").value = respuesta.code;
    estado(privada ? "Sala privada creada." : "Partida pública creada.");
  });
}

function unirse() {
  const codigo = document.getElementById("codigo").value.trim();
  if (!codigo) return estado("Escribí un código.");
  if (!conectado) return estado("Esperá a conectarte.");

  socket.emit("joinRoom", codigo, respuesta => {
    if (!respuesta?.ok) estado(respuesta?.error || "No se pudo entrar.");
  });
}

socket.on("roomJoined", datos => {
  enSala = true;
  otros.clear();

  datos.players.forEach(p => {
    if (p.id !== socket.id) otros.set(p.id,p);
  });

  document.getElementById("sala").textContent =
    "Sala: " + datos.code + " | Jugadores: " + datos.players.length + "/20";

  estado("¡Estás dentro de la partida!");
});

socket.on("playerJoined", p => {
  otros.set(p.id,p);
  actualizarJugadores();
});

socket.on("playerMoved", p => {
  if (otros.has(p.id)) otros.set(p.id,p);
});

socket.on("playerLeft", id => {
  otros.delete(id);
  actualizarJugadores();
});

function actualizarJugadores() {
  document.getElementById("sala").textContent =
    "Jugadores conectados: " + (otros.size+1) + "/20";
}

function buscarSalas() {
  socket.emit("getPublicRooms", salas => {
    const div = document.getElementById("partidas");
    div.innerHTML = "<h3>Partidas públicas</h3>";

    if (!salas || salas.length===0) {
      div.textContent = "No hay partidas públicas disponibles.";
      return;
    }

    salas.forEach(s => {
      const b = document.createElement("button");
      b.textContent = s.code + " (" + s.players + "/20)";
      b.onclick = () => {
        document.getElementById("codigo").value = s.code;
        unirse();
      };
      div.appendChild(b);
    });
  });
}

const teclas = {};
document.addEventListener("keydown",e => {
  teclas[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup",e => {
  teclas[e.key.toLowerCase()] = false;
});

function actualizar() {
  if (enSala) {
    if (teclas.w || teclas.arrowup) jugador.y -= 4;
    if (teclas.s || teclas.arrowdown) jugador.y += 4;
    if (teclas.a || teclas.arrowleft) jugador.x -= 4;
    if (teclas.d || teclas.arrowright) jugador.x += 4;

    jugador.x = Math.max(20,Math.min(880,jugador.x));
    jugador.y = Math.max(20,Math.min(530,jugador.y));

    if (Date.now()-ultimoEnvio>50) {
      socket.emit("playerMove", {x:jugador.x,y:jugador.y});
      ultimoEnvio = Date.now();
    }
  }
}

function dibujar() {
  ctx.clearRect(0,0,900,550);
  ctx.fillStyle="#8bcf75";
  ctx.fillRect(0,0,900,550);

  ctx.fillStyle="#2878ed";
  ctx.beginPath();
  ctx.arc(jugador.x,jugador.y,20,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="14px Arial";
  ctx.fillText("VOS",jugador.x-12,jugador.y-28);

  otros.forEach(p => {
    ctx.fillStyle="#e53935";
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText("RIVAL",p.x-18,p.y-28);
  });
}

function loop() {
  actualizar();
  dibujar();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
